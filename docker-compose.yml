# CSCMaster on Linux: PostgreSQL 18 + API + UI.
# HTTPS/domains: the server's common Caddy (VpsSetup caddy/sites/cscmaster.caddy) proxies
#   UI_PUBLIC_URL  -> 127.0.0.1:UI_HOST_PORT  (default 8085)
#   API_PUBLIC_URL -> 127.0.0.1:API_HOST_PORT (default 8084)
# Settings: /root/common/env/cscmaster.env (linked as .env next to this file).
# On the server, update.sh downloads this file from the release branch and keeps everything up to date:
#   sudo /root/cscmaster/update.sh
# See DOCKER.md.

name: cscmaster

services:
  postgres:
    image: postgres:18
    container_name: cscmaster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-cscmaster}"
      TZ: "${TZ:-UTC}"                     # only affects log timestamps
    # The app decides which time zone each date column holds (CSCMasterAPI/Utils/AppClock.cs); keep the database on UTC.
    command: ["postgres", "-c", "timezone=UTC"]
    volumes:
      - postgres-data:/var/lib/postgresql   # database files (PostgreSQL 18 image layout)
      - ./backups:/backups                  # SQL Server .bak files for import-sqlserver.sh
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5435}:5432"   # only reachable from the server itself (SSH tunnel for pgAdmin/DBeaver)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ${POSTGRES_DB:-cscmaster}"]
      interval: 10s
      timeout: 5s
      retries: 12

  api:
    # Published by GitHub Actions (.github/workflows/docker-image.yml). Local build: docker compose build
    image: ghcr.io/retinuesoft/cscmaster-api:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      target: api
    container_name: cscmaster-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      DatabaseProvider: "Postgres"
      ConnectionStrings__Postgres: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-cscmaster};Username=postgres;Password=${POSTGRES_PASSWORD}"
      BusinessTimeZone: "${BUSINESS_TIME_ZONE:-Asia/Kolkata}"
      Jwt__Key: "${JWT_KEY:?Set JWT_KEY in .env}"
      Cors__AllowedOrigins__0: "${UI_PUBLIC_URL:?Set UI_PUBLIC_URL in .env}"
      Cors__Origins: "${CORS_ORIGINS:-}"   # other addresses the UI is opened from
      TZ: "${TZ:-UTC}"
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8084}:8080"   # only the server's common Caddy reaches it (API_PUBLIC_URL)

  ui:
    image: ghcr.io/retinuesoft/cscmaster-ui:${APP_IMAGE_TAG:-latest}
    build:
      context: .
      target: ui
    container_name: cscmaster-ui
    restart: unless-stopped
    depends_on:
      - api
    environment:
      ASPNETCORE_ENVIRONMENT: "Production"
      AppSettings__ApiBaseUrl: "${API_PUBLIC_URL:?Set API_PUBLIC_URL in .env}"   # the browser calls the API here
      TZ: "${TZ:-UTC}"
    ports:
      - "127.0.0.1:${UI_HOST_PORT:-8085}:8080"    # only the server's common Caddy reaches it (UI_PUBLIC_URL)

volumes:
  postgres-data:
